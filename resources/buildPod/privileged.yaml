apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: slave
spec:
  securityContext:
    runAsUser: 1000
  containers:
    - name: #CONTAINER_NAME
      image: #CONTAINER_IMAGE
      command:
        - cat
      tty: true
    - name: docker
      image: #DOCKER_DIND_IMAGE
      command:
        - cat
      tty: true
      securityContext:
        privileged: true
      env:
        - name: DOCKER_BUILDKIT
          value: "1"
      readinessProbe:
        exec:
          command: [sh, -c, "ls -S /var/run/docker.sock"]
      volumeMounts:
        - name: "docker-socket"
          mountPath: "/var/run/docker.sock"
    - name: jnlp
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
  volumes:
    - name: "docker-socket"
      hostPath:
        path: "/var/run/docker.sock"