apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: slave
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 999
  containers:
    - name: #CONTAINER_NAME
      image: #CONTAINER_IMAGE
      command:
        - cat
      tty: true
      securityContext:
        privileged: true
      env:
        - name: DOCKER_BUILDKIT
          value: "1"
        - name: HOME
          value: /tmp
      resources:
        requests:
          cpu: #REQUESTS_CPU
          memory: #REQUESTS_MEM
        limits:
          cpu: #LIMITS_CPU
          memory: #LIMITS_MEM
      readinessProbe:
        exec:
          command: [sh, -c, "ls -S /var/run/docker.sock"]
      volumeMounts:
        - name: "docker-socket"
          mountPath: "/var/run/docker.sock"
    - name: jnlp
      resources:
        requests:
          cpu: "250m"
          memory: "250Mi"
  volumes:
    - name: "docker-socket"
      hostPath:
        path: "/var/run/docker.sock"